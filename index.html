
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FieldForce - De Visitas a Insights Accionables</title>
  <!-- Google Fonts - Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- SheetJS CDN (Excel Uploader) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- FieldForce — config.js and api-service.js load BEFORE app.js -->
  <script src="config.js?v=3"></script>
  <script src="api-service.js?v=5"></script>
  <script src="js/indexed-db.js?v=3"></script>
  <script src="js/geofence.js?v=3"></script>
  <script src="js/sync-queue.js?v=5"></script>
  <!-- MODAL DE CHECK-IN PROMOTOR -->
  <dialog id="checkin-modal" closedby="none" class="modal-dialog" aria-labelledby="checkin-modal-title">
    <div class="modal-content" style="max-width: 450px;">
      <div class="modal-header">
        <h2 id="checkin-modal-title">Check-in de Visita</h2>
        <button type="button" class="btn-close-modal" id="btn-close-checkin-modal">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="modal-body" style="text-align: center;">
        <h3 id="checkin-store-name" style="margin-bottom: 5px;">Nombre de Tienda</h3>
        <p id="checkin-store-address" style="color: var(--neutral-muted); font-size: 0.85rem; margin-bottom: 20px;">Dirección</p>
        
        <div id="checkin-loading" style="padding: 20px;">
          <div class="loader-spinner" style="width: 40px; height: 40px; margin: 0 auto 10px;"></div>
          <p>Obteniendo ubicación GPS...</p>
        </div>
        
        <div id="checkin-results" class="hidden" style="text-align: left; background: var(--bg-body); padding: 15px; border-radius: 8px;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
            <span style="color: var(--text-muted); font-size: 0.85rem;">Precisión GPS:</span>
            <strong id="checkin-accuracy">-- m</strong>
          </div>
          <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
            <span style="color: var(--text-muted); font-size: 0.85rem;">Distancia a tienda:</span>
            <strong id="checkin-distance">-- m</strong>
          </div>
          <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
            <span style="color: var(--text-muted); font-size: 0.85rem;">Radio permitido:</span>
            <strong id="checkin-radius">-- m</strong>
